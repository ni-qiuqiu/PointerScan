[package]
name = "pointer-chain-scanner"
version = "0.1.0"
edition = "2021"
authors = ["Rust Port"]
description = "BFS pointer chain scanner with tmpfile + mmap + zero-copy memory management"

[dependencies]
memmap2 = "0.9"
tempfile = "3.10"
libc = "0.2"
thiserror = "1.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rayon = "1.10"

[target.'cfg(target_os = "android")'.dependencies]
ndk = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lib]
name = "pointer_chain_scanner"
path = "src/lib.rs"

[[bin]]
name = "scanner"
path = "src/main.rs"

# 默认编译目标在 .cargo/config.toml 中配置
